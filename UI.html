    <style>
        :root {
            /* --- [保留] 品牌配色 --- */
            --brand-primary: #5468AA;
            --brand-secondary: #F0F2F9;
            --brand-accent: #FFA07A;
            
            /* --- [保留] 基礎顏色 --- */
            --bg-color: #FAFAFC;
            --text-main: #2D3436;
            --text-light: #636E72;
            --card-bg: #FFFFFF;
            
            /* 新增排版變數 */
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Noto Sans TC', sans-serif;
            
            /* 放射式設計專用 */
            --circle-size: 240px; /* 主圓盤大小 */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            font-family: var(--font-sans);
            background: radial-gradient(circle at top center, #F0F2F9 0%, #FAFAFC 70%); /* 放射狀背景 */
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Layout: Centered & Radial --- */
        .content-wrap { 
            max-width: 500px; 
            margin: 0 auto; 
            padding: 20px 24px 100px 24px; 
            display: flex; flex-direction: column; align-items: center;
        }

        .hidden { display: none !important; }

        /* --- Header: Center Alignment --- */
        .brand-header {
            padding: 40px 0 20px 0;
            text-align: center;
            width: 100%;
        }
        
        .brand-logo {
            font-size: 10px; font-weight: 700; letter-spacing: 3px;
            color: var(--brand-accent); text-transform: uppercase; margin-bottom: 5px;
        }
        .brand-title {
            margin: 0; 
            font-family: var(--font-serif);
            font-size: 32px; 
            color: var(--brand-primary);
            font-weight: 700;
        }

        .btn-lang {
            position: absolute; top: 20px; right: 20px;
            background: transparent; border: 1px solid #E0E4EB;
            color: var(--text-light); padding: 5px 12px;
            border-radius: 20px; font-size: 10px; font-weight: 700;
            cursor: pointer;
        }

        /* --- 1. Dose: The "Sun" (Central Dial) --- */
        /* 這是放射式的核心：巨大的圓形控制器 */
        .dose-planet-wrap {
            position: relative;
            width: var(--circle-size);
            height: var(--circle-size);
            margin: 20px auto 40px auto;
            display: flex; justify-content: center; align-items: center;
        }
        
        .dose-planet {
            width: 100%; height: 100%;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 20px 50px rgba(84, 104, 170, 0.15), 
                        inset 0 0 0 1px rgba(84, 104, 170, 0.05); /* 外光暈 */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative;
            z-index: 2;
        }

        /* 裝飾軌道線 */
        .orbit-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 1px dashed #E0E4EB; border-radius: 50%; z-index: 0;
            pointer-events: none;
        }
        .orbit-1 { width: 320px; height: 320px; opacity: 0.6; }
        .orbit-2 { width: 450px; height: 450px; opacity: 0.3; }

        .dose-label {
            font-size: 11px; letter-spacing: 2px; color: var(--text-light); 
            text-transform: uppercase; margin-bottom: 5px;
        }
        .dose-display { 
            font-family: var(--font-serif);
            font-size: 80px; font-weight: 600; 
            color: var(--brand-primary); line-height: 1;
        }
        .dose-unit { font-size: 14px; color: var(--brand-accent); font-weight: 600; }

        /* 將 Slider 隱藏在圓盤下方，作為互動層 */
        .slider-wrapper {
            position: absolute; bottom: -40px; width: 200px; text-align: center;
        }
        input[type=range] { 
            width: 100%; -webkit-appearance: none; background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 4px; background: #E0E4EB; border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: var(--brand-primary); margin-top: -8px; 
            border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
