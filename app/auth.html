<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth</title>
    <!-- 引入必要的字型和 Supabase -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --brand-primary: #2C241B;
            --brand-secondary: #E6D5C3;
            --brand-accent: #8C6B5D;
        }
        body {
            background-color: transparent; /* 讓背景透明，融入主頁面 */
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-card {
            background: #fff;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        .btn-primary {
            background: var(--brand-primary);
            color: white;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: #4A3E32;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            box-sizing: border-box; /* 修正寬度問題 */
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 id="auth-title" style="font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: var(--brand-primary); margin-bottom: 0.5rem;">Welcome Back</h2>
        <p id="auth-desc" style="color: #666; margin-bottom: 1.5rem;">Sign in to save your brews.</p>

        <input type="email" id="modal-email" placeholder="Email Address">
        <input type="password" id="modal-password" placeholder="Password">

        <button id="btn-auth-action" class="btn-primary" onclick="handleAuthAction()">Log In</button>

        <div style="margin-top: 1.5rem; font-size: 0.9rem; color: #888;">
            <span id="auth-toggle-msg">New here?</span>
            <button id="auth-toggle-btn" onclick="toggleAuthMode()" style="color: var(--brand-accent); font-weight: bold; margin-left: 5px; text-decoration: underline;">Create an account</button>
        </div>
    </div>

    <script>
        // --- 設定 (與 Index.html 相同) ---
        const SUPABASE_PROJECT_URL = "https://yinylgixpfekynvpnkxw.supabase.co";
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpbnlsZ2l4cGZla3ludnBua3h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3MTAzNDIsImV4cCI6MjA4NDI4NjM0Mn0.nP675NMyX1w2UzOrsKWoiVIbG5CEawew_Y1NdMqf7LM';
        const _supabase = supabase.createClient(SUPABASE_PROJECT_URL, _supabaseKey);
        const STRIPE_PRICE_ID = "price_1SsN7SLlNkzJbqVvn8VcerXF";

        let isLoginMode = true;

        // --- 翻譯與文字 ---
        // 為了簡化，這裡簡單處理，如果需要跟隨主頁語言，可以透過 URL 參數傳遞 ?lang=zh
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'en';

        const texts = {
            en: { title_in: "Welcome Back", title_up: "Join BrewLab", btn_in: "Log In", btn_up: "Sign Up", msg_new: "New here?", msg_old: "Already have account?", link_new: "Create account", link_old: "Log In" },
            zh: { title_in: "歡迎回來", title_up: "加入 BrewLab", btn_in: "登入", btn_up: "註冊", msg_new: "還沒有帳號？", msg_old: "已經有帳號了？", link_new: "註冊新帳號", link_old: "登入" }
        };

        function updateUI() {
            const t = texts[currentLang];
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('btn-auth-action');
            const msg = document.getElementById('auth-toggle-msg');
            const toggle = document.getElementById('auth-toggle-btn');

            if (isLoginMode) {
                title.innerText = t.title_in;
                btn.innerText = t.btn_in;
                msg.innerText = t.msg_new;
                toggle.innerText = t.link_new;
            } else {
                title.innerText = t.title_up;
                btn.innerText = t.btn_up;
                msg.innerText = t.msg_old;
                toggle.innerText = t.link_old;
            }
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            updateUI();
        }

        // --- 主要邏輯 ---

        async function handleAuthAction() {
            const email = document.getElementById('modal-email').value;
            const password = document.getElementById('modal-password').value;
            const btn = document.getElementById('btn-auth-action');

            if (!email || !password) return alert("Please fill in all fields.");

            const originalText = btn.innerText;
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                if (isLoginMode) {
                    // --- 登入 ---
                    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    
                    // 成功登入後，通知父視窗 (Index.html)
                    window.parent.postMessage({ type: 'AUTH_SUCCESS', user: data.user }, '*');
                } else {
                    // --- 註冊 ---
                    if (password.length < 6) throw new Error("Password too short.");
                    
                    // 1. Supabase 註冊
                    const { data, error } = await _supabase.auth.signUp({ email, password });
                    if (error) throw error;

                    btn.innerText = "Redirecting...";
                    
                    // 2. Stripe 付款 (複製原本邏輯)
                    // 注意：這裡的 returnUrl 改回指向主頁
                    const returnUrl = window.parent.location.origin + window.parent.location.pathname;
                    
                    const response = await fetch(`${SUPABASE_PROJECT_URL}/functions/v1/checkout`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _supabaseKey },
                        body: JSON.stringify({ email, userId: data.user.id, priceId: STRIPE_PRICE_ID, returnUrl })
                    });
                    
                    if (!response.ok) throw new Error("Payment Error");
                    const result = await response.json();
                    
                    if (result.url) {
                        window.top.location.href = result.url; // 整個頁面跳轉
                    }
                }
            } catch (err) {
                alert(err.message);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // 初始化
        updateUI();
    </script>
</body>
</html>
