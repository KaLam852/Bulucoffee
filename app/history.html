<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Brews - BrewLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 簡單的底部導覽列樣式 (手機版常用) */
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9ca3af; font-size: 0.75rem; }
        .nav-item.active { color: #d97706; } /* 橘色 */
    </style>
</head>
<body class="bg-stone-50 text-stone-800 pb-20">

    <header class="bg-white shadow p-4 sticky top-0 z-10">
        <h1 class="text-xl font-bold text-center text-stone-800">☕️ 沖煮日記 (My Journal)</h1>
    </header>

    <main id="brewList" class="p-4 space-y-4 max-w-md mx-auto">
        <p class="text-center text-gray-500 mt-10">載入中...</p>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around py-3 z-50">
        <a href="index.html" class="nav-item">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
            掃描 (Scan)
        </a>
        <a href="history.html" class="nav-item active">
            <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"></path></svg>
            日記 (Journal)
        </a>
        <a href="#" onclick="doLogout()" class="nav-item">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            登出 (Exit)
        </a>
    </nav>

    <script>
        // 1. 初始化 Supabase (請換成你的 URL 和 Key)
        const supabaseUrl = '你的_SUPABASE_URL';
        const supabaseKey = '你的_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. 載入歷史紀錄
        async function loadBrews() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = 'index.html'; // 沒登入就踢回首頁
                return;
            }

            // 去資料庫抓資料 (按時間倒序)
            const { data: brews, error } = await supabase
                .from('brews')
                .select('*')
                .order('created_at', { ascending: false });

            const list = document.getElementById('brewList');
            
            if (!brews || brews.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-gray-400">目前沒有紀錄<br>快去掃描第一包豆子吧！</div>`;
                return;
            }

            // 產生列表 HTML
            list.innerHTML = brews.map(brew => `
                <div class="bg-white p-4 rounded-lg shadow border border-stone-100">
                    <div class="flex justify-between items-start">
                        <h3 class="font-bold text-lg text-stone-800">${brew.bean_name || '未命名豆子'}</h3>
                        <span class="text-xs bg-orange-100 text-orange-800 px-2 py-1 rounded">${brew.roast_level}</span>
                    </div>
                    <p class="text-sm text-gray-500 mt-1">📍 ${brew.notes || '無產地資訊'}</p>
                    <div class="mt-3 text-sm text-gray-600 line-clamp-3 overflow-hidden" style="max-height: 4.5em;">
                        ${brew.recipe ? brew.recipe.substring(0, 100) + '...' : '無參數'}
                    </div>
                    <div class="mt-3 pt-3 border-t border-gray-100 text-xs text-gray-400 flex justify-between">
                        <span>${new Date(brew.created_at).toLocaleDateString()}</span>
                        <button class="text-green-600 font-bold">查看詳情 ></button>
                    </div>
                </div>
            `).join('');
        }

        async function doLogout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        // 啟動
        loadBrews();
    </script>
</body>
</html>
